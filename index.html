<!DOCTYPE html>
<html lang="en" data-theme="light" data-theme-set="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1" id="metaTheme">
<title>Focus — Minimal Timer</title>

<!-- Apply saved / system theme before first paint (no flash) -->
<script>
(function () {
  try {
    var m = localStorage.getItem('focus.theme') || 'system';
    var d = m === 'system'
      ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : m;
    document.documentElement.dataset.theme = d;
    document.documentElement.dataset.themeSet = m;
  } catch (e) {}
})();
</script>

<style>
  /* ---------------------------------------------------------------
     Design tokens
  --------------------------------------------------------------- */
  :root {
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
            'Helvetica Neue', Arial, sans-serif;
    --radius: 22px;
  }

  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f4f1;
    --surface: #ffffff;
    --surface-2: #f7f7f4;
    --text: #16161a;
    --muted: #8b8b93;
    --border: #e8e8e3;
    --accent: #cf5f3c;
    --accent-soft: rgba(207, 95, 60, .10);
    --short: #2f9e6e;
    --long: #4a7bd6;
    --shadow: 0 1px 2px rgba(20,20,30,.04), 0 10px 30px rgba(20,20,30,.06);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e0e10;
    --surface: #17171a;
    --surface-2: #1f1f23;
    --text: #f1f1f3;
    --muted: #8b8b95;
    --border: #28282e;
    --accent: #e8825e;
    --accent-soft: rgba(232, 130, 94, .14);
    --short: #4cc38a;
    --long: #7099f0;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.35);
  }

  /* ---------------------------------------------------------------
     Base
  --------------------------------------------------------------- */
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .25s ease, color .25s ease;
  }

  button { font-family: inherit; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 18px 16px 56px;
  }

  /* ---------------------------------------------------------------
     Top bar
  --------------------------------------------------------------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 4px 18px;
  }

  .brand {
    font-size: .95rem;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .theme-switch {
    display: flex;
    gap: 2px;
    padding: 3px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .theme-switch button {
    width: 32px;
    height: 28px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background-color .18s ease, color .18s ease;
  }

  .theme-switch button svg { width: 15px; height: 15px; }

  .theme-switch button.active {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .theme-switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------------------------------------------------------------
     Timer card
  --------------------------------------------------------------- */
  .timer-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 18px 22px;
    transition: background-color .25s ease, border-color .25s ease;
  }

  .timer-card[data-phase="focus"] { --phase: var(--accent); }
  .timer-card[data-phase="short"] { --phase: var(--short); }
  .timer-card[data-phase="long"]  { --phase: var(--long); }

  /* Preset pills */
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-bottom: 18px;
  }

  .preset {
    font-size: .74rem;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all .18s ease;
    white-space: nowrap;
  }

  .preset:hover { color: var(--text); border-color: var(--muted); }

  .preset.active {
    background: var(--accent-soft);
    border-color: transparent;
    color: var(--accent);
    font-weight: 600;
  }

  .preset:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Dial */
  .dial {
    position: relative;
    width: clamp(200px, 62vw, 278px);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    display: grid;
    place-items: center;
  }

  .dial svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    overflow: visible;
  }

  .dial circle { fill: none; stroke-width: 6; }

  .track { stroke: var(--border); }

  .progress {
    stroke: var(--phase);
    stroke-linecap: round;
    transition: stroke-dashoffset .2s linear, stroke .3s ease, opacity .3s ease;
  }

  .dial-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-align: center;
    padding: 0 12px;
  }

  .phase-label {
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--phase);
    transition: color .3s ease;
  }

  .time-display {
    font-size: clamp(2.15rem, 11vw, 3.1rem);
    font-weight: 300;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    color: var(--text);
  }

  .meta-label {
    font-size: .72rem;
    color: var(--muted);
    letter-spacing: .01em;
  }

  /* Controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
  }

  .btn {
    font-size: .92rem;
    font-weight: 500;
    padding: 12px 26px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    transition: all .18s ease;
  }

  .btn:hover { border-color: var(--muted); }
  .btn:active { transform: scale(.97); }

  .btn.primary {
    background: var(--phase);
    border-color: transparent;
    color: #fff;
    min-width: 132px;
    font-weight: 600;
    box-shadow: 0 6px 18px -8px var(--phase);
  }

  .btn.primary:hover { filter: brightness(1.06); }

  .btn.ghost {
    background: transparent;
    color: var(--muted);
    padding: 12px 18px;
    font-size: .86rem;
  }

  .btn.ghost:hover { color: var(--text); }

  .btn:focus-visible { outline: 2px solid var(--phase, var(--accent)); outline-offset: 2px; }

  /* Custom panel */
  .custom-panel {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px dashed var(--border);
  }

  .custom-panel[hidden] { display: none; }

  .custom-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
    gap: 10px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .field span {
    font-size: .66rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  .field input {
    width: 100%;
    font-family: inherit;
    font-size: .9rem;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    outline: none;
    transition: border-color .18s ease;
  }

  .field input:focus { border-color: var(--accent); }

  /* ---------------------------------------------------------------
     Tasks card
  --------------------------------------------------------------- */
  .tasks-card {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    transition: background-color .25s ease, border-color .25s ease;
  }

  .tasks-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .tasks-head h2 {
    margin: 0;
    font-size: .82rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .tasks-count { font-size: .72rem; color: var(--muted); }

  .task-form { display: flex; gap: 8px; }

  .task-form input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: .9rem;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    outline: none;
    transition: border-color .18s ease;
  }

  .task-form input::placeholder { color: var(--muted); }
  .task-form input:focus { border-color: var(--accent); }

  .task-form button {
    border: 1px solid transparent;
    background: var(--text);
    color: var(--surface);
    border-radius: 12px;
    padding: 0 18px;
    font-size: .86rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .18s ease, transform .1s ease;
  }

  .task-form button:hover { opacity: .85; }
  .task-form button:active { transform: scale(.97); }

  .task-list {
    list-style: none;
    margin: 12px 0 0;
    padding: 0;
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 11px 2px;
    border-bottom: 1px solid var(--border);
    animation: fadeIn .22s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  .task:last-child { border-bottom: none; }

  .check {
    flex: 0 0 auto;
    width: 21px;
    height: 21px;
    margin-top: 1px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    color: transparent;
    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
    transition: all .18s ease;
  }

  .check svg { width: 12px; height: 12px; }

  .check:hover { border-color: var(--short); }

  .check.is-done {
    background: var(--short);
    border-color: var(--short);
    color: #fff;
  }

  .task-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .task-text {
    font-size: .92rem;
    line-height: 1.42;
    overflow-wrap: anywhere;
    transition: color .18s ease;
  }

  .task.is-done .task-text {
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
    color: var(--muted);
  }

  .badge {
    font-size: .62rem;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .badge.is-done { color: var(--short); }

  .task-edit {
    font-family: inherit;
    font-size: .92rem;
    padding: 6px 9px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--surface-2);
    color: var(--text);
    outline: none;
    width: 100%;
  }

  .task-actions {
    display: flex;
    gap: 2px;
    flex: 0 0 auto;
  }

  .icon-btn {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color .16s ease, background-color .16s ease;
  }

  .icon-btn svg { width: 15px; height: 15px; }

  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn.danger:hover { color: #e05252; }

  .empty-state {
    text-align: center;
    font-size: .82rem;
    color: var(--muted);
    padding: 22px 0 8px;
  }

  /* ---------------------------------------------------------------
     Responsive
  --------------------------------------------------------------- */
  @media (max-width: 420px) {
    .app { padding: 14px 12px 44px; }
    .timer-card { padding: 16px 12px 18px; border-radius: 18px; }
    .tasks-card { padding: 15px 14px; border-radius: 18px; }
    .btn { padding: 11px 20px; }
    .btn.primary { min-width: 116px; }
    .preset { font-size: .7rem; padding: 6px 10px; }
    .controls { gap: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<body>
<div class="app">

  <header class="topbar">
    <div class="brand">Focus</div>

    <div class="theme-switch" role="group" aria-label="Theme">
      <button type="button" data-theme-set="light" title="Light" aria-label="Light theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button type="button" data-theme-set="dark" title="Dark" aria-label="Dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
      <button type="button" data-theme-set="system" title="System" aria-label="System theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <!-- ================= TIMER ================= -->
    <section class="timer-card" id="timerCard" data-phase="focus">
      <div class="presets" id="presets"></div>

      <div class="dial">
        <svg viewBox="0 0 220 220" aria-hidden="true">
          <circle class="track" cx="110" cy="110" r="100"></circle>
          <circle class="progress" id="ring" cx="110" cy="110" r="100"></circle>
        </svg>
        <div class="dial-inner">
          <div class="phase-label" id="phaseLabel">Focus</div>
          <div class="time-display" id="timeDisplay" role="timer" aria-live="off">25:00</div>
          <div class="meta-label" id="metaLabel">Round 1 of 4</div>
        </div>
      </div>

      <div class="controls">
        <button type="button" class="btn primary" id="primaryBtn">Start</button>
        <button type="button" class="btn ghost" id="resetBtn">Reset</button>
        <button type="button" class="btn ghost" id="skipBtn">Skip</button>
      </div>

      <!-- Custom settings (only for the Custom preset) -->
      <div class="custom-panel" id="customPanel" hidden>
        <div class="custom-grid">
          <label class="field"><span>Focus min</span>
            <input type="number" id="cFocusMin" min="0" max="180" step="1" value="25">
          </label>
          <label class="field"><span>Focus sec</span>
            <input type="number" id="cFocusSec" min="0" max="59" step="1" value="0">
          </label>
          <label class="field"><span>Sessions</span>
            <input type="number" id="cSessions" min="1" max="20" step="1" value="4">
          </label>
          <label class="field"><span>Short break</span>
            <input type="number" id="cShort" min="1" max="60" step="1" value="5">
          </label>
          <label class="field"><span>Long break</span>
            <input type="number" id="cLong" min="1" max="120" step="1" value="15">
          </label>
        </div>
      </div>
    </section>

    <!-- ================= TASKS ================= -->
    <section class="tasks-card">
      <div class="tasks-head">
        <h2>Tasks</h2>
        <span class="tasks-count" id="tasksCount"></span>
      </div>

      <form class="task-form" id="taskForm" autocomplete="off">
        <input type="text" id="taskInput" placeholder="Add a task…" maxlength="140" aria-label="New task">
        <button type="submit">Add</button>
      </form>

      <ul class="task-list" id="taskList"></ul>
      <div class="empty-state" id="taskEmpty">No tasks yet — add one to get started.</div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };

  /* =============================================================
     PRESETS
  ============================================================= */
  var PRESETS = {
    pomodoro:   { label: 'Pomodoro',    focus: 25 * 60, short:  5 * 60, long: 15 * 60, rounds: 4 },
    ultradian:  { label: 'Ultradian 90',focus: 90 * 60, short: 20 * 60, long: 30 * 60, rounds: 3 },
    r5217:      { label: '52 / 17',     focus: 52 * 60, short: 17 * 60, long: 30 * 60, rounds: 4 },
    extended:   { label: 'Extended',    focus: 50 * 60, short: 10 * 60, long: 30 * 60, rounds: 4 },
    flowmodoro: { label: 'Flowmodoro',  focus: 0,       short:  5 * 60, long: 15 * 60, rounds: 4, countUp: true },
    tabata:     { label: 'Tabata',      focus: 20,      short: 10,      long:  3 * 60, rounds: 8 },
    hiit4030:   { label: 'HIIT 40/30',  focus: 40,      short: 30,      long:  5 * 60, rounds: 8 },
    custom:     { label: 'Custom',      focus: 25 * 60, short:  5 * 60, long: 15 * 60, rounds: 4, isCustom: true }
  };

  var STORE_THEME = 'focus.theme';
  var STORE_TASKS = 'focus.tasks';
  var STORE_PRESET = 'focus.preset';

  /* =============================================================
     ELEMENTS
  ============================================================= */
  var el = {
    card:        $('#timerCard'),
    presets:     $('#presets'),
    ring:        $('#ring'),
    phaseLabel:  $('#phaseLabel'),
    timeDisplay: $('#timeDisplay'),
    metaLabel:   $('#metaLabel'),
    primary:     $('#primaryBtn'),
    reset:       $('#resetBtn'),
    skip:        $('#skipBtn'),
    customPanel: $('#customPanel'),
    taskForm:    $('#taskForm'),
    taskInput:   $('#taskInput'),
    taskList:    $('#taskList'),
    taskEmpty:   $('#taskEmpty'),
    tasksCount:  $('#tasksCount'),
    metaTheme:   $('#metaTheme'),
    cFocusMin:   $('#cFocusMin'),
    cFocusSec:   $('#cFocusSec'),
    cSessions:   $('#cSessions'),
    cShort:      $('#cShort'),
    cLong:       $('#cLong')
  };

  var RING_C = 2 * Math.PI * 100; // circumference of r=100
  el.ring.style.strokeDasharray = RING_C;
  el.ring.style.strokeDashoffset = 0;

  /* =============================================================
     STATE
  ============================================================= */
  var state = {
    preset: 'pomodoro',
    phase: 'focus',        // focus | short | long
    remaining: 25 * 60,    // seconds left (countdown) / elapsed (count-up)
    running: false,
    completedFocus: 0,     // focus rounds completed in this cycle
    lastTs: 0
  };

  var tickHandle = null;

  /* =============================================================
     AUDIO  (Web Audio API — no external files)
  ============================================================= */
  var audioCtx = null;

  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { audioCtx = new AC(); } catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    return audioCtx;
  }

  function tone(freq, delay, dur, type, vol) {
    var ctx = getAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime + delay;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  /* Start sound — distinct per phase */
  function playStartSound(phase) {
    if (phase === 'focus') {
      tone(523.25, 0,    0.13, 'sine', 0.11);   // C5
      tone(659.25, 0.10, 0.18, 'sine', 0.11);   // E5
    } else if (phase === 'short') {
      tone(659.25, 0,    0.13, 'sine', 0.11);   // E5
      tone(523.25, 0.10, 0.18, 'sine', 0.11);   // C5
    } else {
      tone(523.25, 0,    0.11, 'sine', 0.10);   // C5
      tone(659.25, 0.09, 0.11, 'sine', 0.10);   // E5
      tone(783.99, 0.18, 0.22, 'sine', 0.10);   // G5
    }
  }

  /* End sound — clearly different from any start sound */
  function playEndSound() {
    tone(880.00, 0,    0.14, 'triangle', 0.16);
    tone(880.00, 0.20, 0.14, 'triangle', 0.16);
    tone(1174.66,0.40, 0.34, 'triangle', 0.16);
  }

  /* =============================================================
     CONFIG HELPERS
  ============================================================= */
  function numVal(input, def, min, max) {
    var v = parseFloat(input.value);
    if (!isFinite(v)) v = def;
    v = Math.round(v);
    return Math.max(min, Math.min(max, v));
  }

  function getConfig() {
    if (state.preset === 'custom') {
      var fMin = numVal(el.cFocusMin, 25, 0, 180);
      var fSec = numVal(el.cFocusSec, 0, 0, 59);
      var focus = fMin * 60 + fSec;
      if (focus < 1) focus = 1;
      return {
        label: 'Custom',
        focus: focus,
        short: numVal(el.cShort, 5, 1, 60) * 60,
        long:  numVal(el.cLong, 15, 1, 120) * 60,
        rounds: numVal(el.cSessions, 4, 1, 20)
      };
    }
    return PRESETS[state.preset];
  }

  function phaseDuration(phase, cfg) {
    cfg = cfg || getConfig();
    if (phase === 'focus') return cfg.focus;
    if (phase === 'short') return cfg.short;
    return cfg.long;
  }

  function isCountUp(cfg) {
    cfg = cfg || getConfig();
    return !!cfg.countUp && state.phase === 'focus';
  }

  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function phaseName(phase) {
    return phase === 'focus' ? 'Focus' : (phase === 'short' ? 'Short Break' : 'Long Break');
  }

  /* =============================================================
     RENDER
  ============================================================= */
  function render() {
    var cfg = getConfig();
    var total = phaseDuration(state.phase, cfg);
    var countUp = isCountUp(cfg);

    /* Time */
    var shown = countUp ? Math.floor(state.remaining) : Math.ceil(state.remaining);
    el.timeDisplay.textContent = fmt(shown);
    document.title = fmt(shown) + ' · ' + phaseName(state.phase);

    /* Phase */
    el.card.dataset.phase = state.phase;
    el.phaseLabel.textContent = phaseName(state.phase);

    /* Meta */
    if (state.phase === 'focus') {
      var r = Math.min(state.completedFocus + 1, cfg.rounds);
      el.metaLabel.textContent = 'Round ' + r + ' of ' + cfg.rounds;
    } else if (state.phase === 'short') {
      el.metaLabel.textContent = 'Break after round ' + Math.max(1, state.completedFocus);
    } else {
      el.metaLabel.textContent = 'Cycle complete · ' + cfg.rounds + ' rounds';
    }

    /* Progress ring */
    var p;
    if (countUp) {
      p = (state.remaining % 60) / 60;              // sweeps each minute
    } else {
      p = total > 0 ? 1 - (state.remaining / total) : 0;
    }
    p = Math.max(0, Math.min(1, p));
    el.ring.style.strokeDashoffset = String(RING_C * (1 - p));

    /* Primary button label */
    var fresh = countUp ? state.remaining < 0.05
                        : Math.abs(state.remaining - total) < 0.05;
    if (state.running) {
      el.primary.textContent = 'Pause';
    } else {
      el.primary.textContent = fresh ? 'Start' : 'Resume';
    }

    /* Skip button label */
    el.skip.textContent = countUp ? 'End focus' : 'Skip';
  }

  /* =============================================================
     TIMER ENGINE
  ============================================================= */
  function startTickLoop() {
    if (tickHandle) return;
    state.lastTs = Date.now();
    tickHandle = setInterval(tick, 200);
  }

  function stopTickLoop() {
    if (tickHandle) {
      clearInterval(tickHandle);
      tickHandle = null;
    }
  }

  function tick() {
    var now = Date.now();
    var dt = (now - state.lastTs) / 1000;
    state.lastTs = now;
    if (!state.running) return;
    if (dt < 0) dt = 0;
    if (dt > 3600) dt = 3600;

    var cfg = getConfig();

    if (isCountUp(cfg)) {
      state.remaining += dt;
    } else {
      state.remaining -= dt;
      if (state.remaining <= 0) {
        state.remaining = 0;
        render();
        onPhaseComplete();
        return;
      }
    }
    render();
  }

  function startTimer() {
    if (state.running) return;
    var cfg = getConfig();
    if (!isCountUp(cfg) && state.remaining <= 0) {
      state.remaining = phaseDuration(state.phase, cfg);
    }
    state.running = true;
    playStartSound(state.phase);
    startTickLoop();
    render();
  }

  function pauseTimer() {
    if (!state.running) return;
    tick();                 // capture exact remaining
    state.running = false;
    stopTickLoop();
    render();
  }

  function toggleTimer() {
    if (state.running) pauseTimer();
    else startTimer();
  }

  function advancePhase() {
    var cfg = getConfig();
    if (state.phase === 'focus') {
      state.completedFocus += 1;
      var next = (state.completedFocus % cfg.rounds === 0) ? 'long' : 'short';
      setPhase(next);
    } else {
      setPhase('focus');
    }
  }

  function onPhaseComplete() {
    state.running = false;
    stopTickLoop();
    playEndSound();
    advancePhase();
    render();
  }

  function setPhase(phase) {
    var cfg = getConfig();
    state.phase = phase;
    state.running = false;
    stopTickLoop();
    state.remaining = isCountUp(cfg) && phase === 'focus'
      ? 0
      : phaseDuration(phase, cfg);
    render();
  }

  function resetAll() {
    state.running = false;
    stopTickLoop();
    state.completedFocus = 0;
    state.phase = 'focus';
    state.remaining = phaseDuration('focus', getConfig());
    render();
  }

  function skipPhase() {
    state.running = false;
    stopTickLoop();
    advancePhase();
    render();
  }

  /* =============================================================
     PRESET UI
  ============================================================= */
  function buildPresets() {
    Object.keys(PRESETS).forEach(function (key) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'preset';
      b.dataset.preset = key;
      b.textContent = PRESETS[key].label;
      b.addEventListener('click', function () { selectPreset(key); });
      el.presets.appendChild(b);
    });
  }

  function selectPreset(key) {
    if (!PRESETS[key]) return;
    state.preset = key;
    state.completedFocus = 0;
    state.running = false;
    stopTickLoop();
    state.phase = 'focus';
    state.remaining = phaseDuration('focus', getConfig());

    el.customPanel.hidden = !PRESETS[key].isCustom;

    Array.prototype.forEach.call(el.presets.children, function (b) {
      b.classList.toggle('active', b.dataset.preset === key);
    });

    try { localStorage.setItem(STORE_PRESET, key); } catch (e) {}
    render();
  }

  /* =============================================================
     THEME
  ============================================================= */
  var mq = window.matchMedia('(prefers-color-scheme: dark)');

  function resolveTheme(mode) {
    if (mode === 'system') return mq.matches ? 'dark' : 'light';
    return mode;
  }

  function applyTheme(mode, persist) {
    var resolved = resolveTheme(mode);
    document.documentElement.dataset.themeSet = mode;
    document.documentElement.dataset.theme = resolved;

    Array.prototype.forEach.call(
      document.querySelectorAll('[data-theme-set]'),
      function (b) {
        if (b.tagName === 'BUTTON') {
          b.classList.toggle('active', b.dataset.themeSet === mode);
        }
      }
    );

    if (el.metaTheme) {
      el.metaTheme.setAttribute('content', resolved === 'dark' ? '#0e0e10' : '#f4f4f1');
    }
    if (persist) {
      try { localStorage.setItem(STORE_THEME, mode); } catch (e) {}
    }
  }

  Array.prototype.forEach.call(
    document.querySelectorAll('.theme-switch button'),
    function (b) {
      b.addEventListener('click', function () {
        applyTheme(b.dataset.themeSet, true);
      });
    }
  );

  var onSystemChange = function () {
    if (document.documentElement.dataset.themeSet === 'system') {
      applyTheme('system', false);
    }
  };
  if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
  else if (mq.addListener) mq.addListener(onSystemChange);

  /* =============================================================
     TASKS
  ============================================================= */
  var tasks = [];
  var editingId = null;

  var SVG_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
  var SVG_EDIT  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  var SVG_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

  function loadTasks() {
    try {
      var raw = localStorage.getItem(STORE_TASKS);
      tasks = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(tasks)) tasks = [];
    } catch (e) { tasks = []; }
  }

  function saveTasks() {
    try { localStorage.setItem(STORE_TASKS, JSON.stringify(tasks)); } catch (e) {}
  }

  function renderTasks() {
    el.taskList.innerHTML = '';
    var focusInput = null;

    el.taskEmpty.style.display = tasks.length ? 'none' : 'block';

    var doneCount = tasks.filter(function (t) { return t.done; }).length;
    el.tasksCount.textContent = tasks.length
      ? doneCount + ' of ' + tasks.length + ' done'
      : '';

    tasks.forEach(function (t) {
      var li = document.createElement('li');
      li.className = 'task' + (t.done ? ' is-done' : '');

      /* --- Checkbox --- */
      var check = document.createElement('button');
      check.type = 'button';
      check.className = 'check' + (t.done ? ' is-done' : '');
      check.setAttribute('aria-label', t.done ? 'Mark as active' : 'Mark as completed');
      check.innerHTML = SVG_CHECK;
      check.addEventListener('click', function () {
        t.done = !t.done;
        saveTasks();
        renderTasks();
      });
      li.appendChild(check);

      /* --- Body --- */
      var body = document.createElement('div');
      body.className = 'task-body';

      if (editingId === t.id) {
        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'task-edit';
        input.value = t.text;
        input.maxLength = 140;

        var settled = false;
        var commit = function () {
          if (settled) return;
          settled = true;
          var v = input.value.trim();
          if (v) t.text = v;
          editingId = null;
          saveTasks();
          renderTasks();
        };

        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          else if (e.key === 'Escape') {
            e.preventDefault();
            settled = true;
            editingId = null;
            renderTasks();
          }
        });
        input.addEventListener('blur', commit);

        body.appendChild(input);
        focusInput = input;
      } else {
        var text = document.createElement('div');
        text.className = 'task-text';
        text.textContent = t.text;
        body.appendChild(text);
      }

      var badge = document.createElement('span');
      badge.className = 'badge' + (t.done ? ' is-done' : '');
      badge.textContent = t.done ? 'Completed' : 'Active';
      body.appendChild(badge);

      li.appendChild(body);

      /* --- Actions --- */
      var actions = document.createElement('div');
      actions.className = 'task-actions';

      var editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'icon-btn';
      editBtn.setAttribute('aria-label', 'Edit task');
      editBtn.innerHTML = SVG_EDIT;
      editBtn.addEventListener('click', function () {
        editingId = t.id;
        renderTasks();
      });
      actions.appendChild(editBtn);

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'icon-btn danger';
      delBtn.setAttribute('aria-label', 'Delete task');
      delBtn.innerHTML = SVG_TRASH;
      delBtn.addEventListener('click', function () {
        tasks = tasks.filter(function (x) { return x.id !== t.id; });
        if (editingId === t.id) editingId = null;
        saveTasks();
        renderTasks();
      });
      actions.appendChild(delBtn);

      li.appendChild(actions);
      el.taskList.appendChild(li);
    });

    if (focusInput) {
      focusInput.focus();
      focusInput.select();
    }
  }

  el.taskForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = el.taskInput.value.trim();
    if (!v) return;
    tasks.push({
      id: String(Date.now()) + Math.random().toString(36).slice(2, 7),
      text: v,
      done: false
    });
    el.taskInput.value = '';
    saveTasks();
    renderTasks();
  });

  /* =============================================================
     WIRING
  ============================================================= */
  el.primary.addEventListener('click', toggleTimer);
  el.reset.addEventListener('click', resetAll);
  el.skip.addEventListener('click', skipPhase);

  [el.cFocusMin, el.cFocusSec, el.cSessions, el.cShort, el.cLong].forEach(function (inp) {
    inp.addEventListener('input', function () {
      if (state.preset !== 'custom') return;
      if (!state.running && state.completedFocus === 0) {
        state.remaining = phaseDuration(state.phase, getConfig());
      }
      render();
    });
  });

  /* Pause accurately when tab is hidden and restored */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.running) {
      state.lastTs = Date.now();
    }
  });

  /* =============================================================
     INIT
  ============================================================= */
  function init() {
    /* Theme */
    var savedTheme = 'system';
    try { savedTheme = localStorage.getItem(STORE_THEME) || 'system'; } catch (e) {}
    applyTheme(savedTheme, false);

    /* Presets */
    buildPresets();

    var savedPreset = 'pomodoro';
    try { savedPreset = localStorage.getItem(STORE_PRESET) || 'pomodoro'; } catch (e) {}
    if (!PRESETS[savedPreset]) savedPreset = 'pomodoro';

    /* Tasks */
    loadTasks();
    renderTasks();

    /* Timer */
    state.preset = savedPreset;
    selectPreset(savedPreset);
  }

  init();
})();
</script>
</body>
</html>
